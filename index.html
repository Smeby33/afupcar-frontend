<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lotu | Location de voitures premium en Afrique</title>

    <!-- Balises SEO de base -->
    <meta name="description" content="Lotu est une plateforme de location de voitures sécurisée pour propriétaires et locataires en Afrique. Comparez les modèles, gérez vos réservations et payez en toute confiance." />
    <meta name="keywords" content="location voiture port-gentil, louer voiture gabon, car rental africa, réservation automobile, flotte véhicules, Lotu gabon" />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="Lotu" />
    <meta name="theme-color" content="#000000" />
    <link rel="canonical" href="https://lotu.app/" />

    <!-- Open Graph / Réseaux sociaux -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Lotu" />
    <meta property="og:title" content="Lotu | Location de voitures premium en Afrique" />
    <meta property="og:description" content="Réservez ou gérez vos véhicules en quelques clics, avec des paiements sécurisés et un suivi en temps réel." />
    <meta property="og:url" content="https://lotu.app/" />
    <meta property="og:image" content="https://lotu.app/preview.jpg" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Lotu | Location de voitures premium" />
    <meta name="twitter:description" content="Plateforme complète pour propriétaires et locataires de véhicules en Afrique." />
    <meta name="twitter:image" content="https://lotu.app/preview.jpg" />

    <!-- Ressources PWA / favicon -->
    <link rel="icon" type="image/svg+xml" href="/logo.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Données structurées pour moteurs de recherche -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Lotu",
        "url": "https://lotu.app/",
        "logo": "https://lotu.app/logo.png",
        "sameAs": [
          "https://www.facebook.com/lotu",
          "https://www.instagram.com/lotu",
          "https://www.linkedin.com/company/lotu"
        ],
        "description": "Plateforme digitale de location de voitures connectant propriétaires et conducteurs en Afrique.",
        "contactPoint": {
          "@type": "ContactPoint",
          "contactType": "customer support",
          "email": "support@lotu.app"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
